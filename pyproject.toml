[project]
name = "onshape-mcp-codex"
version = "0.1.0"
description = "Codex-compatible MCP server for driving real Onshape CAD. Fork of jarvis-onshape-mcp (ReshefElisha) re-targeted for OpenAI Codex: sketches, extrudes, fillets, mates, parametric Variable Studios, FeatureScript custom features, multi-view rendering."
authors = [{ name = "Bruce" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["onshape", "cad", "mcp", "codex", "featurescript", "parametric", "robotics"]
dependencies = [
    "mcp>=1.0.0,<2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.27.0",
    "uvicorn>=0.23.0",
    "loguru>=0.7.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "coverage[toml]>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
onshape-mcp-codex = "onshape_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onshape_mcp"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "-ra",
    "--strict-markers",
    "--cov=onshape_mcp",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "asyncio: marks tests as async",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow running",
]

[tool.coverage.run]
source = ["onshape_mcp"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 80
